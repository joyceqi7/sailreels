name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sailreels_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: sailreels_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sailreels_test -d sailreels_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://sailreels_test:local_ci_only@localhost:5432/sailreels_test
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - name: Verify migrations on PostgreSQL
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: ${{ env.TEST_POSTGRES_URL }}
      - run: uv run pytest -q
      - run: uv run python -m scripts.export_openapi --check

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run check:api
      - run: npm test
      - run: npm run build
      - run: npx ttdx minis check --output
