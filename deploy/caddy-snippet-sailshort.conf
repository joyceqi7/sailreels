# Add to the tt-shop Caddyfile (/opt/tt-shop/deploy/Caddyfile) — do NOT put this in a separate file,
# Caddy only reads that one path. Append it as a sibling of the existing pubgm/tts/sailreels site blocks.
# This is SailShort only. Do not replace deploy/caddy-snippet.conf (that one is SailReels).
#
# DNS must already point sailshort.sailson.com at this host, or certificate issuance fails.
# After editing:
#   docker exec tts-caddy caddy validate --config /etc/caddy/Caddyfile     # must print "Valid configuration"
#   docker exec tts-caddy caddy reload   --config /etc/caddy/Caddyfile     # reload checks first; a bad
#                                                                          # config leaves the old one running
#   curl -sS https://sailshort.sailson.com/healthz                         # expect {"ok":true,...}
#
# Caddy provisions and renews the certificate automatically once DNS resolves to this host.
# The API is reached by container name on the shared deploy_backend network; no host port is used.
# API_ALIAS in /opt/sailshort/apps/api/.env must be sailshort-api. A shared alias with SailReels or
# SailTale would make Caddy split webhooks across backends.
#
# IMPORTANT: /opt/tt-shop/deploy/Caddyfile is tracked by the tt-shop repo. Commit this block there
# too, otherwise the next tt-shop redeploy of Caddy will drop it and sailshort.sailson.com goes dark.

sailshort.sailson.com {
	encode zstd gzip
	reverse_proxy sailshort-api:8000 {
		# Webhooks: the signature is computed over the exact request body and the
		# TikTok-Signature header, so neither may be rewritten.
		header_up X-Forwarded-Proto https
	}
}
